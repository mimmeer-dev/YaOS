name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile the OS
      run: make

    - uses: actions/upload-artifact@v7
      with:
        name: os-floppy-build
        path: dist/yaos.img
