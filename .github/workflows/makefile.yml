name: Build YaOS

on:
  push:
    branches: [ "main" ]
  schedule:
     - cron: "5 20 * * *"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up NASM
      uses: ilammy/setup-nasm@v1.5.1

    - name: Install Clang
      uses: egor-tensin/setup-clang@v2.3

    - name: Compile the OS
      run: make

    - uses: actions/upload-artifact@v7
      with:
        name: os-floppy-build
        path: dist/yaos.img
